name: release

on:
  push:
    tags:
      - "v*"

# The repository default for GITHUB_TOKEN is read-only, so the release job must
# opt in. contents: write is the whole requirement — it covers creating the
# release and uploading assets. Declaring permissions resets every other scope
# to none, which is what we want: no packages, no id-token, no discussions.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git Checkout
        # fetch-depth: 0 is mandatory. The default shallow fetch leaves
        # goreleaser with no tags and no history to build release notes from.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tag is immutable once the module proxy has seen it, so this is the
      # last honest gate. Deliberately does not run `go generate`: that would
      # dirty the tree, and goreleaser refuses to build a dirty tree.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # The version this binary reports comes from VCS stamping rather than
      # ldflags, so it can fail silently if stamping is ever disabled. Assert it
      # before anything is published.
      - name: Assert the binary reports the tag
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/trello-cli" ./cmd/trello-cli
          got=$("${RUNNER_TEMP}/trello-cli" version -o json | jq -r '.data.version')
          if [ "$got" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::binary reports version '$got', expected '${GITHUB_REF_NAME}'"
            exit 1
          fi
          echo "version stamp ok: $got"

      # Installed rather than used as a third-party action: this repository's
      # allowed-actions policy is not readable from here, and a restrictive one
      # would fail at "Prepare all required actions" with an error that reads
      # like a network fault. This also pins the exact goreleaser build.
      #
      # GOTOOLCHAIN=auto is load-bearing. setup-go v6+ exports
      # GOTOOLCHAIN=local, and goreleaser v2.17.1 declares go 1.26.5 while this
      # module pins 1.24.1 — so under `local` this step fails outright rather
      # than fetching the newer toolchain to build goreleaser with. That fetch
      # is what already happens today; this only keeps it. Scoped to this step
      # so the vet, test, and build steps stay on the go.mod version.
      - name: Install goreleaser
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: goreleaser check
        run: goreleaser check

      # The Homebrew cask is pushed to abigotado/homebrew-tap, a different
      # repository, which the built-in GITHUB_TOKEN cannot write to at any
      # permission level — its scope ends at the repository containing this
      # workflow. HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped to that tap
      # and nothing else.
      #
      # Ordering matters if it is ever missing or expired: goreleaser creates
      # the GitHub release before it pushes the cask, so a token failure leaves
      # a complete release with no cask rather than no release. Re-running this
      # job on the same tag is the fix — replace_existing_artifacts and
      # replace_existing_draft are set for exactly that.
      - name: goreleaser release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
