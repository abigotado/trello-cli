name: go

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race is not optional here: the client paces and retries from shared
      # state, and a data race there would surface as a wrong rate-limit
      # decision rather than a crash.
      - name: go test
        run: go test -race ./...

      # goreleaser check needs no tag, so a broken release config is caught on
      # every pull request instead of at release time, when the tag is already
      # public and immutable.
      #
      # GOTOOLCHAIN=auto for the same reason as in release.yaml: setup-go v6+
      # exports GOTOOLCHAIN=local, and goreleaser v2.17.1 declares go 1.26.5
      # against this module's 1.24.1. Scoped to this step so the steps above
      # stay on the go.mod version.
      - name: goreleaser check
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          goreleaser check

      # Everything above this line checks Go. The release path is mostly shell
      # living in workflow files — release.yaml decides whether the cask may
      # move, cask.yaml verifies and pushes it — and nothing was checking any of
      # it. actionlint validates the workflow expressions and hands every `run:`
      # block to shellcheck, which is what catches an unquoted expansion, a
      # pipeline whose failure is swallowed, or a context that does not exist in
      # a step `if:`. Those are the mistakes that only show up during a release,
      # against a tag that is already public and immutable.
      #
      # Pinned rather than @latest: a lint gate that changes what it rejects on
      # its own schedule turns an unrelated pull request red. No GOTOOLCHAIN
      # here, unlike goreleaser above — actionlint declares go 1.18, so the
      # go.mod toolchain builds it.
      - name: actionlint
        run: |
          set -euo pipefail
          # actionlint falls back to workflow-syntax-only when shellcheck is
          # missing, and reports success having checked no shell at all.
          # ubuntu-latest ships it; assert that rather than assume it, because
          # the failure mode is silent loss of coverage.
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck is not installed; actionlint would skip every run: block"
            exit 1
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

      # The generated contract is what agents read. If regenerating changes it,
      # the committed copy no longer matches internal/errx.
      - name: Generated contract is current
        run: |
          go generate ./...
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::go generate changed tracked files; commit the result:"
            echo "$DIRTY"
            git diff
            exit 1
          fi
